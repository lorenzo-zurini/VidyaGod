name: Build VidyaGod AppImage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build AppImage (Ubuntu 22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential cmake git wget patchelf \
            qt6-base-dev qt6-tools-dev \
            libqt6opengl6-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev

      - name: Install linuxdeployqt
        run: |
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage
          sudo mv linuxdeployqt-continuous-x86_64.AppImage /usr/local/bin/linuxdeployqt

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/Qt6

      - name: Build project
        run: |
          cmake --build build --target AppImage -j$(nproc)

      - name: List build output
        run: |
          ls -R build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-AppImage
          path: build/*.AppImage
