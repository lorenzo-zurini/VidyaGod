name: Build VidyaGod Flatpak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flatpak and builder tools
      - name: Install Flatpak tools
        run: |
          sudo apt update
          sudo apt install -y flatpak flatpak-builder

      # 3. Install system dependencies for building your app
      - name: Install dependencies
        run: |
          sudo apt install -y build-essential cmake git \
            qt6-base-dev qt6-tools-dev \
            libqt6opengl6-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev \
            libxkbcommon-dev nlohmann-json3-dev

      # 4. Configure and build your project
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build -j$(nproc)

      # 5. Install Flatpak SDK
      - name: Install Flatpak SDK
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.freedesktop.Sdk//22.08
          flatpak install -y flathub org.freedesktop.Platform//22.08


      # 6. Build Flatpak using manifest in flatpak/
      - name: Build Flatpak
        run: |
          mkdir -p build/flatpak
          flatpak-builder --force-clean build/flatpak \
            flatpak/org.vidyagod.VidyaGod.json

      # 7. Copy manifest somewhere else (optional)
      - name: Copy Flatpak manifest
        run: |
          mkdir -p dist/flatpak
          cp flatpak/org.vidyagod.VidyaGod.json dist/flatpak/

      # 8. Upload the manifest as artifact
      - name: Upload Flatpak manifest
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-Flatpak-Manifest
          path: dist/flatpak/org.vidyagod.VidyaGod.json
