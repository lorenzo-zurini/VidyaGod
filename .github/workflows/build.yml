name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Linux: build all targets + run tests, then package a portable AppImage.
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04

    # 22.04's default g++ is gcc-11, whose libstdc++ has no std::atomic<std::shared_ptr<>> specialization
    # (added in gcc-12) — VidyaGodFS/src/overlay.h needs it for the lock-free deletion-mask sets. We install
    # gcc-12 and build with it, but stay on 22.04 (glibc 2.35) so the AppImage keeps its portability floor.
    # CC/CXX are honoured by CMake at configure time and by cgo when it builds libvgipfs.so.
    env:
      CC: gcc-12
      CXX: g++-12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Go (for the embedded IPFS node, VidyaGodIPFS → libvgipfs.so)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: VidyaGodIPFS/go.sum

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ g++-12 gcc-12 build-essential qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6opengl6-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev fuse3 libfuse3-dev tree \
            libxkbcommon-dev nlohmann-json3-dev wget pkg-config patchelf \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev
          # patchelf: required by linuxdeployqt (it aborts silently without it); pre-installed on the runner
          # image today, but pinned here so the AppImage packaging step never depends on the image contents.

      - name: Build libzip from source (22.04's libzip is too old for zip_source_zip_file)
        run: |
          # Ubuntu 22.04 ships libzip 1.7; the case-conflict resolver needs zip_source_zip_file (libzip 1.10+).
          # Build a recent libzip into /usr/local so pkg-config/gcc pick it up ahead of the system one, while
          # keeping the AppImage on 22.04's older glibc for portability.
          sudo apt-get remove -y libzip-dev || true
          wget -q https://libzip.org/download/libzip-1.10.1.tar.gz
          tar xf libzip-1.10.1.tar.gz
          cmake -S libzip-1.10.1 -B libzip-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build libzip-build -j"$(nproc)"
          sudo cmake --install libzip-build
          sudo ldconfig

      - name: Test embedded IPFS node (offline)
        run: |
          # Storage + fetch mechanics + CID parity, no network (the tests force VIDYAGOD_IPFS_OFFLINE).
          cd VidyaGodIPFS
          go test -race ./...   # -race is mandatory: a torn-string race shipped past a green non-race suite (2026-09-04)

      - name: Build VidyaGod
        run: |
          # Builds all targets: the GUI app (VidyaGod), the FUSE helper (vidyagodfs), and the embedded IPFS node
          # (libvgipfs.so, built by CMake via `go build -buildmode=c-shared` and linked into VidyaGod).
          # -DVIDYAGOD_WERROR=ON: warnings fail the build in CI (local dev stays non-blocking) + export
          # compile_commands.json for the clang-tidy step.
          export PATH=/usr/lib/qt6/bin:$PATH
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}   # the source-built libzip 1.10.1
          mkdir -p build
          cd build
          cmake .. -DVIDYAGOD_WERROR=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          make -j"$(nproc)"

      - name: C++ unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Sanitizer pass (ASan+UBSan on the engine + FS test suites)
        run: |
          # A second small configure with the sanitizers ON, building only the two pure suites (vg_tests
          # exercises vgdelta/registry/varsubst/manifest logic; vgfs_tests the whole overlay/masks/zip core).
          cmake -S . -B build-asan -DVIDYAGOD_WERROR=ON -DVIDYAGOD_SANITIZE=ON
          cmake --build build-asan --target vg_tests vgfs_tests -j"$(nproc)"
          ./build-asan/vg_tests
          ./build-asan/VidyaGodFS/vgfs_tests

      - name: clang-tidy (advisory)
        continue-on-error: true   # advisory for now — surfaces issues without gating the build
        run: |
          sudo apt install -y clang-tidy
          # 'src/*.cpp' is a git glob that doesn't cross '/', silently skipping src/platform/ and the
          # whole FUSE submodule — use recursive globs so every compiled TU is linted.
          clang-tidy -p build $(git ls-files 'src/**/*.cpp' 'src/*.cpp') \
                              $(git -C VidyaGodFS ls-files 'src/*.cpp' | sed 's|^|VidyaGodFS/|')

      - name: Prepare AppDir
        run: |
          set -euxo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps
          # vidyagodfs MUST sit beside VidyaGod in usr/bin — the app locates it via /proc/self/exe.
          cp build/VidyaGod AppDir/usr/bin/
          cp build/vidyagodfs AppDir/usr/bin/
          # The embedded IPFS node is linked into VidyaGod ($ORIGIN rpath). Put it in usr/lib (AppRun's
          # LD_LIBRARY_PATH) AND beside the binary in usr/bin (the $ORIGIN rpath + linuxdeployqt bundling).
          cp build/libvgipfs.so AppDir/usr/lib/
          cp build/libvgipfs.so AppDir/usr/bin/
          mkdir -p AppDir/usr/share/applications
          # Desktop + icon go in BOTH the AppDir root (where appimagetool picks them up to integrate into the
          # final .AppImage) and the canonical FHS locations (standard AppDir layout / desktop integration).
          cp resources/org.vidyagod.VidyaGod.desktop AppDir/
          cp resources/org.vidyagod.VidyaGod.desktop AppDir/usr/share/applications/
          cp resources/org.vidyagod.VidyaGod.png AppDir/
          cp resources/org.vidyagod.VidyaGod.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp resources/AppRun AppDir/
          chmod +x AppDir/AppRun

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Bundle vidyagodfs (libzip + libfuse3) and libvgipfs (its deps)
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/vidyagodfs \
            --library build/libvgipfs.so

      - name: Download linuxdeployqt
        run: |
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

      - name: Bundle main app with linuxdeployqt
        run: |
          export PATH=/usr/lib/qt6/bin:$PATH
          # Ubuntu's /usr/bin/qmake is a qtchooser stub that errors without a default ("could not find a Qt
          # installation of ''"); linuxdeployqt needs a real qmake to locate Qt6 — point it at qmake6.
          sudo ln -sf "$(command -v qmake6)" /usr/local/bin/qmake
          export LD_LIBRARY_PATH="$PWD/build:$PWD/AppDir/usr/lib:$LD_LIBRARY_PATH"
          # Pass the BINARY, not the .desktop: the linuxdeployqt continuous build silently exits 1 on the
          # desktop-file form with Qt6 (reproduced in a clean 22.04 + qt6-base-dev container). The binary form
          # bundles Qt6 + the xcb platform plugin correctly; the final -appimage step (appimagetool) then picks
          # up the desktop file + icon from the AppDir root to integrate them into the .AppImage.
          ./linuxdeployqt-continuous-x86_64.AppImage AppDir/usr/bin/VidyaGod -appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-AppImage
          path: "VidyaGod*.AppImage"

  # ---------------------------------------------------------------------------
  # Windows: build all targets with MinGW-w64 (MSYS2), package a portable dist
  # (windeployqt) and an NSIS installer.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 + MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-nlohmann-json
            mingw-w64-x86_64-go

      - name: Install WinFsp SDK (headers + lib for the vidyagodfs build)
        shell: pwsh
        run: |
          $url = "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
          Invoke-WebRequest -Uri $url -OutFile winfsp.msi
          # ADDLOCAL=ALL includes the Developer feature (inc/fuse3 + lib/winfsp-x64.lib + bin/winfsp-x64.dll).
          Start-Process msiexec.exe -ArgumentList '/i','winfsp.msi','/qn','ADDLOCAL=ALL' -Wait

      - name: Install NSIS (installer builder)
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build VidyaGod (MinGW-w64)
        run: |
          # MSYS2's Go binary is trimmed and needs GOROOT in the env.
          export GOROOT=/mingw64/lib/go
          export PATH=/mingw64/bin:$PATH
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DWINFSP_ROOT="C:/Program Files (x86)/WinFsp" -B build
          cmake --build build

      - name: C++ unit tests (ctest, Windows)
        run: |
          export PATH=/mingw64/bin:$PATH
          # The Windows job used to BUILD the tests and never run them — gate on them like Linux does.
          ctest --test-dir build --output-on-failure

      - name: Package portable distribution (windeployqt)
        run: |
          export PATH=/mingw64/bin:$PATH
          bash tools/windeploy.sh build dist

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist"
          $out  = "$env:GITHUB_WORKSPACE\VidyaGodSetup.exe"
          $nsi  = "$env:GITHUB_WORKSPACE\tools\vidyagod.nsi"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DDISTDIR=$dist" "/DOUTFILE=$out" "$nsi"

      - name: Upload portable dist
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-Windows-portable
          path: dist/**

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-Windows-Installer
          path: VidyaGodSetup.exe
