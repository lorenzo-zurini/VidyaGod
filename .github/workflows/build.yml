name: Build VidyaGod Flatpak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak Builder & Dependencies
        run: |
          sudo apt update
          sudo apt install -y flatpak-builder flatpak cmake git wget ninja-build

      - name: Build Flatpak
        run: |
          mkdir -p build/flatpak
          
          # Create a simple manifest file for Flatpak
          cat > build/flatpak/vidyagod.json << 'EOF'
{
  "app-id": "org.vidyagod.VidyaGod",
  "runtime": "org.kde.Platform",
  "runtime-version": "6.6",
  "sdk": "org.kde.Sdk",
  "command": "VidyaGod",
  "finish-args": [
    "--share=network",
    "--share=ipc",
    "--filesystem=home"
  ],
  "modules": [
    {
      "name": "vidyagod",
      "buildsystem": "cmake",
      "buildsystem-options": {
        "build-args": ["-DCMAKE_BUILD_TYPE=Release"]
      },
      "sources": [
        {
          "type": "git",
          "url": "https://github.com/<YOUR_GITHUB_USER>/VidyaGod.git",
          "branch": "main"
        }
      ]
    }
  ]
}
EOF

          # Build the Flatpak using the manifest
          flatpak-builder --force-clean --repo=build/repo build/flatpak/build-dir build/flatpak/vidyagod.json

      - name: Export Flatpak bundle
        run: |
          flatpak build-bundle build/repo build/VidyaGod.flatpak org.vidyagod.VidyaGod

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-Flatpak
          path: build/VidyaGod.flatpak
