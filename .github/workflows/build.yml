name: Package VidyaGod Flatpak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flatpak and builder tools
      - name: Install Flatpak tools
        run: |
          sudo apt update
          sudo apt install -y flatpak flatpak-builder

      # 3. Ensure Flathub remote & SDK/platform for user
      - name: Setup Flatpak SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Sdk//22.08
          flatpak install --user -y flathub org.freedesktop.Platform//22.08

      # 4. Show directory structure for debugging
      - name: Show project tree
        run: |
          echo "Current directory: $(pwd)"
          find . -type f -ls

      # 5. Build Flatpak using existing binary
      - name: Build Flatpak
        run: |
          mkdir -p build/flatpak
          flatpak-builder --force-clean build/flatpak flatpak/org.vidyagod.VidyaGod.json

      # 6. Export Flatpak bundle
      - name: Export Flatpak bundle
        run: |
          mkdir -p dist/flatpak
          flatpak-builder --run build/flatpak flatpak/org.vidyagod.VidyaGod.json /usr/bin/true
          # Export to bundle
          flatpak build-bundle build/flatpak dist/flatpak/VidyaGod.flatpak org.vidyagod.VidyaGod 22.08

      # 7. Upload Flatpak bundle
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-Flatpak
          path: dist/flatpak/VidyaGod.flatpak
