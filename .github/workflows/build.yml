name: Build Flatpak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flatpak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y flatpak flatpak-builder cmake g++ build-essential \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6opengl6-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev \
            libxkbcommon-dev nlohmann-json3-dev


      - name: Build app
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Prepare Flatpak context
        run: |
          mkdir -p flatpak/files
          # Copy built binary and resources
          cp build/Desktop-Debug/VidyaGod flatpak/files/ || cp build/VidyaGod flatpak/files/
          cp resources/VidyaGod.desktop flatpak/files/
          cp resources/VidyaGod.png flatpak/files/

          echo "Flatpak build context:"
          find flatpak -maxdepth 3 -type f

      - name: Build Flatpak bundle
        run: |
          mkdir -p build/flatpak
          flatpak-builder --force-clean build/flatpak flatpak/org.vidyagod.VidyaGod.json
          flatpak build-export build/repo build/flatpak
          flatpak build-bundle build/repo VidyaGod.flatpak org.vidyagod.VidyaGod

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-flatpak
          path: VidyaGod.flatpak
