name: Build AppImage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Go (for the embedded IPFS node, external/VidyaGodIPFS → libvgipfs.so)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: external/VidyaGodIPFS/go.sum

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ build-essential qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6opengl6-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev fuse3 libfuse3-dev tree \
            libxkbcommon-dev nlohmann-json3-dev libzip-dev wget pkg-config

          # Make Qt6 binaries available in PATH
          export PATH=/usr/lib/qt6/bin:$PATH
          qmake -v

      - name: Test embedded IPFS node (offline)
        run: |
          # Storage + fetch mechanics + CID parity, no network (the tests force VIDYAGOD_IPFS_OFFLINE).
          cd external/VidyaGodIPFS
          go test ./...

      - name: Build VidyaGod
        run: |
          # Builds all targets: the GUI app (VidyaGod), the FUSE helper (vidyagodfs), and the embedded IPFS node
          # (libvgipfs.so, built by CMake via `go build -buildmode=c-shared` and linked into VidyaGod).
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Prepare AppDir
        run: |
          set -euxo pipefail

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy the app binary AND the FUSE helper. vidyagodfs MUST sit beside VidyaGod in
          # usr/bin — the app locates it via /proc/self/exe (the binary's own directory).
          cp build/VidyaGod AppDir/usr/bin/
          cp build/vidyagodfs AppDir/usr/bin/

          # The embedded IPFS node is linked into VidyaGod (DT_NEEDED libvgipfs.so, $ORIGIN rpath). Put it in
          # usr/lib so AppRun's LD_LIBRARY_PATH=$APPDIR/usr/lib resolves it at runtime, AND beside the binary in
          # usr/bin so the $ORIGIN rpath resolves it too (and linuxdeployqt finds it while bundling VidyaGod).
          cp build/libvgipfs.so AppDir/usr/lib/
          cp build/libvgipfs.so AppDir/usr/bin/

          # Copy desktop file
          cp resources/org.vidyagod.VidyaGod.desktop AppDir/

          # Copy main icon
          cp resources/org.vidyagod.VidyaGod.png AppDir/

          # Copy AppRun
          cp resources/AppRun AppDir/
          chmod +x AppDir/AppRun

      - name: Download linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Bundle vidyagodfs (libzip + libfuse3) and libvgipfs (its deps)
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/vidyagodfs \
            --library build/libvgipfs.so

      - name: Download linuxdeployqt
        run: |
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

      - name: Bundle main app with linuxdeployqt
        run: |
          export PATH=/usr/lib/qt6/bin:$PATH
          # Let linuxdeployqt resolve VidyaGod's NEEDED libvgipfs.so while processing the binary.
          export LD_LIBRARY_PATH="$PWD/build:$PWD/AppDir/usr/lib:$LD_LIBRARY_PATH"

          # Bundle your Qt app
          ./linuxdeployqt-continuous-x86_64.AppImage AppDir/org.vidyagod.VidyaGod.desktop -appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-AppImage
          path: "VidyaGod*.AppImage"
