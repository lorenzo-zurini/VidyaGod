name: Build AppImage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ build-essential qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6opengl6-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev \
            libxkbcommon-dev nlohmann-json3-dev wget fuse-zip autoconf automake libtool pkg-config

          # Make Qt6 binaries available in PATH
          export PATH=/usr/lib/qt6/bin:$PATH
          qmake -v

      - name: Build VidyaGod
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Build unionfs-fuse
        run: |
          git clone https://github.com/rpodgorny/unionfs-fuse.git
          cd unionfs-fuse
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo
          make -j$(nproc)

      - name: Prepare AppDir
        run: |
          set -euxo pipefail

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy your app binary
          cp build/VidyaGod AppDir/usr/bin/

          # Copy default config
          cp resources/DefaultConfig.JSON AppDir/usr/bin/

          # Copy desktop file
          cp resources/org.vidyagod.VidyaGod.desktop AppDir/

          # Copy main icon
          cp resources/org.vidyagod.VidyaGod.png AppDir/

          # Copy AppRun
          cp resources/AppRun AppDir/
          chmod +x AppDir/AppRun

          # Copy fuse-zip binary
          cp /usr/bin/fuse-zip AppDir/usr/bin/

      - name: Download linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Bundle unionfs-fuse and fuse-zip
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable AppDir/usr/bin/unionfs-fuse
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable AppDir/usr/bin/fuse-zip

      - name: Download linuxdeployqt
        run: |
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

      - name: Bundle main app with linuxdeployqt
        run: |
          export PATH=/usr/lib/qt6/bin:$PATH

          # Bundle your Qt app
          ./linuxdeployqt-continuous-x86_64.AppImage AppDir/org.vidyagod.VidyaGod.desktop -appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-AppImage
          path: "VidyaGod*.AppImage"
