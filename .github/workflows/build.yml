name: Build VidyaGod Flatpak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flatpak:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install Flatpak and builder tools
      - name: Install Flatpak
        run: |
          sudo apt update
          sudo apt install -y flatpak flatpak-builder

      # 3️⃣ Copy Flatpak manifest (optional if you want to separate it)
      - name: Copy Flatpak manifest
        run: mkdir -p flatpak && cp flatpak/org.vidyagod.VidyaGod.json flatpak/

      # 4️⃣ Build Flatpak
      - name: Build Flatpak
        run: |
          mkdir -p flatpak/build-dir flatpak/repo
          flatpak-builder --force-clean --repo=flatpak/repo flatpak/build-dir flatpak/org.vidyagod.VidyaGod.json

      # 5️⃣ Export Flatpak bundle
      - name: Export Flatpak bundle
        run: |
          flatpak build-bundle flatpak/repo flatpak/VidyaGod.flatpak org.vidyagod.VidyaGod

      # 6️⃣ Upload Flatpak artifact
      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-Flatpak
          path: flatpak/VidyaGod.flatpak
