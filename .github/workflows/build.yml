name: Build VidyaGod Flatpak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flatpak and builder tools
      - name: Install Flatpak tools
        run: |
          sudo apt update
          sudo apt install -y flatpak flatpak-builder

      # 3. Install system dependencies
      - name: Install dependencies
        run: |
          sudo apt install -y build-essential cmake git \
            qt6-base-dev qt6-tools-dev \
            libqt6opengl6-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev \
            libxkbcommon-dev nlohmann-json3-dev

      # 4. Configure and build your project
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build -j$(nproc)

      # 5. Add Flathub remote and install SDK locally for user
      - name: Setup Flatpak SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Sdk//22.08
          flatpak install --user -y flathub org.freedesktop.Platform//22.08

      # 6. Build Flatpak
      - name: Build Flatpak
        run: |
          mkdir -p build/flatpak
          flatpak-builder --force-clean build/flatpak flatpak/org.vidyagod.VidyaGod.json

      # 7. List the build output for debug
      - name: Show Flatpak build output
        run: |
          echo "Contents of build/flatpak:"
          find build/flatpak
          echo "Contents of .flatpak-builder:"
          find .flatpak-builder

      # 8. Copy manifest to dist/flatpak
      - name: Copy Flatpak manifest
        run: |
          mkdir -p dist/flatpak
          cp flatpak/org.vidyagod.VidyaGod.json dist/flatpak/

      # 9. Upload Flatpak manifest as artifact
      - name: Upload Flatpak manifest
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-Flatpak-Manifest
          path: dist/flatpak/org.vidyagod.VidyaGod.json
