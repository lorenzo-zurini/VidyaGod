name: Build VidyaGod AppImage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC 12
        run: |
          sudo apt update
          sudo apt install -y gcc-12 g++-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          gcc --version
          g++ --version

      - name: Install dependencies
        run: |
          sudo apt install -y build-essential cmake git wget patchelf \
            qt6-base-dev qt6-tools-dev \
            libqt6opengl6-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev \
            libxkbcommon-dev nlohmann-json3-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/usr/bin/gcc-12 -DCMAKE_CXX_COMPILER=/usr/bin/g++-12

      - name: Build project
        run: cmake --build build -j$(nproc)

      - name: Install linuxdeployqt
        run: |
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage
          sudo mv linuxdeployqt-continuous-x86_64.AppImage /usr/local/bin/linuxdeployqt

      - name: Prepare Qt environment
        run: |
          export PATH=/usr/lib/qt6/bin:$PATH
          export LD_LIBRARY_PATH=/usr/lib/qt6/lib:$LD_LIBRARY_PATH

      - name: Copy desktop file and icon
        run: |
          mkdir -p build
          cp resources/VidyaGod.desktop build/VidyaGod.desktop
          cp resources/VidyaGod.png build/  # Desktop icon

      - name: Fix desktop file for linuxdeployqt
        run: |
          sed -i 's|Icon=.*|Icon=VidyaGod|' build/VidyaGod.desktop

      - name: Create AppImage
        run: |
          mkdir -p build/appimage
          cp build/Desktop-Debug/VidyaGod build/appimage/
          cp resources/VidyaGod.desktop build/appimage/
          cp resources/VidyaGod.png build/appimage/
      
          # Make desktop file point to the correct icon name (without extension)
          sed -i 's|Icon=.*|Icon=VidyaGod|' build/appimage/VidyaGod.desktop
      
          # Set Qt paths for this step
          export PATH=/usr/lib/qt6/bin:$PATH
          export LD_LIBRARY_PATH=/usr/lib/qt6/lib:$LD_LIBRARY_PATH
      
          # Run linuxdeployqt pointing at desktop file, with explicit binary
          linuxdeployqt build/appimage/VidyaGod.desktop \
            -appimage \
            -executable=build/appimage/VidyaGod

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-AppImage
          path: "*.AppImage"
