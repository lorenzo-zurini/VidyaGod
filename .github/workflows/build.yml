name: Build AppImage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ build-essential qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6opengl6-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev \
            libxkbcommon-dev nlohmann-json3-dev wget fuse-zip

          # Make Qt6 binaries (qmake, etc.) available in PATH
          export PATH=/usr/lib/qt6/bin:$PATH
          qmake -v

      - name: Build project
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy binary
          cp build/VidyaGod AppDir/usr/bin/

          # Copy default config
          cp resources/DefaultConfig.JSON AppDir/usr/bin/

          # Copy desktop file
          cp resources/org.vidyagod.VidyaGod.desktop AppDir/

          # Copy main icon to the root of AppDir
          cp resources/org.vidyagod.VidyaGod.png AppDir/

          # Bundle fuse-zip
          cp /usr/bin/fuse-zip AppDir/usr/bin/

          # Copy AppRun
          cp resources/AppRun AppDir/
          chmod +x AppDir/AppRun

          # Copy DefaultConfig.JSON
          cp resources/DefaultConfig.JSON AppDir/

      - name: Download linuxdeployqt
        run: |
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

      - name: Build AppImage
        run: |
          # Make sure Qt6 qmake is on PATH for linuxdeployqt
          export PATH=/usr/lib/qt6/bin:$PATH
          ./linuxdeployqt-continuous-x86_64.AppImage AppDir/org.vidyagod.VidyaGod.desktop -appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: VidyaGod-AppImage
          path: "*.AppImage"
